<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dress Up & Makeup Girls</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, Helvetica, sans-serif;
            background: #f8f7fb;
            color: #333;
        }

        .container {
            width: 90%;
            max-width: 600px;
            padding: 50px 40px;
            text-align: center;
            background: #fff;
            border-radius: 20px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        }

        h1 {
            margin: 0 0 15px;
            font-size: 34px;
            color: #222;
        }

        p {
            margin-bottom: 35px;
            color: #666;
            font-size: 16px;
        }

        .links {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        a {
            display: block;
            padding: 15px 20px;
            border-radius: 10px;
            background: #6c4ab6;
            color: #fff;
            text-decoration: none;
            font-size: 16px;
            transition: opacity 0.2s ease;
        }

        a:hover {
            opacity: 0.85;
        }

        .footer {
            margin-top: 35px;
            padding-top: 20px;
            border-top: 1px solid #eee;
            color: #999;
            font-size: 13px;
        }

        @media (max-width: 600px) {
            .container {
                padding: 40px 25px;
            }

            h1 {
                font-size: 28px;
            }
        }
    </style>
</head>

<body>

<div class="container">

</html>
